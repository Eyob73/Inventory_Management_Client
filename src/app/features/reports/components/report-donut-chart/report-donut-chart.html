<div class="donut-chart-container">
  @if (!hasData()) {
    <div class="empty-chart">
      <span class="material-icons">pie_chart</span>
      <p>No data available</p>
    </div>
  } @else {
    <div style="position: relative; height: 250px; width: 100%;">
      <canvas #chartCanvas></canvas>
    </div>
  }
</div>
