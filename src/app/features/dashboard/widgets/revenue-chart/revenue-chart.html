<span class="panel-note">Mon – Sun</span>

<div class="chart-wrap">
  <svg viewBox="0 0 560 190" preserveAspectRatio="none" class="chart-svg">
    <defs>
      <linearGradient id="revFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--teal)" stop-opacity="0.28" />
        <stop offset="100%" stop-color="var(--teal)" stop-opacity="0" />
      </linearGradient>
    </defs>

    @for (g of [0, 1, 2, 3]; track g) {
      <line
        x1="0"
        [attr.y1]="16 + g * 52.6"
        x2="560"
        [attr.y2]="16 + g * 52.6"
        stroke="var(--border)"
        stroke-width="1"
      />
    }

    <path [attr.d]="areaPath()" fill="url(#revFill)" />
    <path
      [attr.d]="linePath()"
      fill="none"
      stroke="var(--teal)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    @for (p of chartPoints(); track p.day) {
      <g (mouseenter)="hoveredPoint.set($index)" (mouseleave)="hoveredPoint.set(null)">
        <circle [attr.cx]="p.x" [attr.cy]="p.y" r="10" fill="transparent" />
        <circle
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          r="3.5"
          [attr.fill]="hoveredPoint() === $index ? 'var(--teal-dark)' : 'var(--teal)'"
          stroke="var(--surface)"
          stroke-width="1.5"
        />
      </g>
    }
  </svg>

  @if (hoveredPoint() !== null) {
    <div
      class="chart-tooltip"
      [style.left.%]="(chartPoints()[hoveredPoint()!].x / 560) * 100"
    >
      <p class="tt-day">{{ chartPoints()[hoveredPoint()!].day }}</p>
      <p class="tt-value">{{ chartPoints()[hoveredPoint()!].revenue | currency: 'ETB' }}</p>
      <p class="tt-sub">{{ chartPoints()[hoveredPoint()!].orders }} orders</p>
    </div>
  }
</div>

<div class="chart-axis">
  @for (p of chartPoints(); track p.day) {
    <span>{{ p.day }}</span>
  }
</div>
