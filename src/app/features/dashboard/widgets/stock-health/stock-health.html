<p class="panel-note">Bar shows units on hand · line marks reorder point</p>

<div class="stock-list">
  @for (cat of categoryStock; track cat.name) {
    <div class="stock-row">
      <div class="stock-row-head">
        <span class="stock-name">{{ cat.name }}</span>
        <span class="stock-count">
          <span [class.low]="isLow(cat)">{{ cat.inStock | number }}</span>
          &nbsp;/&nbsp;{{ cat.capacity | number }} units
        </span>
      </div>
      <div class="stock-track">
        <div
          class="stock-fill"
          [class.low]="isLow(cat)"
          [style.width.%]="stockPct(cat)"
        ></div>
        <div
          class="stock-marker"
          [style.left.%]="reorderPct(cat)"
          matTooltip="Reorder point"
        ></div>
      </div>
    </div>
  }
</div>
