<div class="kpi-body">
  <div class="kpi-value">{{ kpi().value }}</div>

  <div class="kpi-delta-row">
    <span class="kpi-delta" [class.negative]="!kpi().positive">
      <mat-icon>{{ kpi().positive ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
      {{ kpi().delta }}
    </span>
    <span class="kpi-sub">{{ kpi().sub }}</span>
  </div>
</div>
