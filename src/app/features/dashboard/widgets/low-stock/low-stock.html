<ng-container *transloco="let t">
  <div class="low-stock-container">
    @if (lowStockAlerts().length > 0) {
      <div class="alerts-list">
        @for (a of lowStockAlerts(); track a.sku) {
        <div class="alert-row">
          <div class="alert-info">
            <p class="alert-name">{{ a.product }}</p>
            <p class="alert-sku mono">{{ a.sku }}</p>
          </div>
          <div class="alert-qty">
            <p class="alert-onhand mono" [class.error]="a.currentStock === 0">{{ a.currentStock }} in stock</p>
          </div>
        </div>
        }
      </div>
    }

    <div class="reorder-action-wrap">
      <button type="button" class="create-po-btn" routerLink="/purchases/new">
        <mat-icon class="btn-icon">arrow_forward</mat-icon>
        <span>{{ t('dashboardWidgets.low-stock.createPo') }}</span>
      </button>
    </div>
  </div>
</ng-container>
