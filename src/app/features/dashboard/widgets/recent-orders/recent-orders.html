<table mat-table [dataSource]="topProducts()" class="orders-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Product</th>
    <td mat-cell *matCellDef="let p">{{ p.name }}</td>
  </ng-container>

  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef>Quantity Sold</th>
    <td mat-cell *matCellDef="let p" class="mono">{{ p.quantity }}</td>
  </ng-container>

  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Total Revenue</th>
    <td mat-cell *matCellDef="let p" class="mono strong">{{ p.amount | currency: 'ETB' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
