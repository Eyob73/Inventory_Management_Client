<div class="orders-toolbar">
  <button mat-button class="view-all-btn">View all <mat-icon>arrow_forward</mat-icon></button>
</div>

<table mat-table [dataSource]="recentOrders" class="orders-table">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Order</th>
    <td mat-cell *matCellDef="let o" class="mono">{{ o.id }}</td>
  </ng-container>

  <ng-container matColumnDef="customer">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let o">{{ o.customer }}</td>
  </ng-container>

  <ng-container matColumnDef="items">
    <th mat-header-cell *matHeaderCellDef>Items</th>
    <td mat-cell *matCellDef="let o" class="mono">{{ o.items }}</td>
  </ng-container>

  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let o" class="mono strong">{{ o.total | currency: 'ETB' }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let o">
      <span class="status-chip" [ngClass]="statusClass(o.status)">{{ o.status }}</span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
