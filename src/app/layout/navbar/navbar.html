<header class="navbar" [class.navbar--scrolled]="isScrolled()">
    <div class="navbar__inner">

        <div class="navbar__title-area">
            <h1 class="navbar__page-title">{{ pageTitle() }}</h1>
        </div>

        <div class="navbar__spacer"></div>

        <div class="navbar__actions">
            <div class="navbar__search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <span class="navbar__search-text">Search…</span>
                <kbd class="navbar__kbd">⌘K</kbd>
            </div>

            <button class="navbar__icon-btn" aria-label="Notifications" title="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="navbar__badge">3</span>
            </button>

            <div class="navbar__avatar" title="Account">
                <span>SA</span>
            </div>
        </div>

    </div>
</header>
