<aside class="sidebar" [class.sidebar--collapsed]="isCollapsed()">

    <div class="sidebar__header">
        <a routerLink="/" class="sidebar__brand">
            <span class="sidebar__mark" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none">
                    <rect x="2" y="2" width="16" height="16" rx="4" fill="#0E8C7F" />
                    <rect x="10" y="10" width="16" height="16" rx="4" fill="#0B1F2E" />
                </svg>
            </span>
            @if (!isCollapsed()) {
            <span class="sidebar__wordmark">Management</span>
            }
        </a>

        <button class="sidebar__collapse-btn" type="button" (click)="toggleCollapse()"
            [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
            <svg viewBox="0 0 24 24" [class.is-flipped]="isCollapsed()">
                <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <nav class="sidebar__nav" aria-label="Primary">
        @for (group of navGroups; track group.label) {
        <div class="sidebar__group">
            @if (!isCollapsed()) {
            <p class="sidebar__group-label">{{ group.label }}</p>
            }
            @for (item of group.items; track item.path) {
            <a [routerLink]="item.path" routerLinkActive="is-active" class="sidebar__link"
                [title]="isCollapsed() ? item.label : ''">
                <span class="sidebar__indicator" aria-hidden="true"></span>
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none">
                    <path [attr.d]="item.icon" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                @if (!isCollapsed()) {
                <span class="sidebar__label">{{ item.label }}</span>
                }
            </a>
            }
        </div>
        }
    </nav>

    <div class="sidebar__footer">
        <a routerLink="/profile" class="sidebar__user">
            <span class="sidebar__avatar">AK</span>
            @if (!isCollapsed()) {
            <span class="sidebar__user-info">
                <span class="sidebar__user-name">User Name</span>
                <span class="sidebar__user-role">Admin</span>
            </span>
            }
        </a>
    </div>
</aside>
