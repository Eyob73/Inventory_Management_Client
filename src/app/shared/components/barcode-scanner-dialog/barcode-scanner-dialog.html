<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ t('scanner.scanBarcode') || 'Scan Barcode' }}</h2>

  <mat-dialog-content>
    <div class="scanner-container">
      @if (errorMessage()) {
        <div class="error-message">
          <mat-icon>error_outline</mat-icon>
          <p>{{ errorMessage() }}</p>
        </div>
      }

      <div [hidden]="!!errorMessage()" id="reader"></div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" style="padding: 16px;">
    <button class="btn btn--secondary" mat-dialog-close>{{ t('scanner.cancel') || 'Cancel' }}</button>
  </mat-dialog-actions>
</ng-container>
