<article class="card">
    <div class="card__image-wrapper">
        <!-- <img [src]="product().image" [alt]="product().name" class="card__image" /> -->
    </div>

    <div class="card__content">
        <div class="card__header">
            <h3 class="card__title">{{ product().name }}</h3>
            <span class="card__badge">{{ product().sku }}</span>
        </div>

        <p class="card__description">{{ product().description }}</p>

        <div class="card__footer">
            <div class="card__price-row">
                <span class="card__label">Price</span>
                <span class="card__value">{{ product().price }} ETB</span>
            </div>
            <div class="card__stock-row">
                <span class="card__label">Stock</span>
                <span class="card__value">{{ product().quantityInStock }} units</span>
            </div>
        </div>
        

        <div class="card__actions">
            <a [routerLink]="['/products', product().id]" class="card__btn card__btn--primary">View Details</a>
            <button class="card__btn card__btn--secondary">Edit</button>
        </div>
    </div>
</article>
