<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inventory Management</title>
    <meta
      name="description"
      content="Modern inventory management dashboard for tracking products, sales, and reports."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Must run before first paint — restores dark mode from localStorage
      (function () {
        try {
          var key = 'inv-mgmt-theme-dark';
          var stored = localStorage.getItem(key);
          var dark =
            stored !== null
              ? stored === 'true'
              : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark-theme');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
